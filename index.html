<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#141826" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Books">
    <meta name="description" content="Track what you read, rate it out of 10, and see every upcoming release from the authors and series you follow.">
    <title>Book Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- loaded without blocking start-up; text shows in the fallback font until it arrives -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
    <!-- Fetch every module at once instead of one import level at a time.
         tests/preload.test.js checks this list against the imports in js/app.js. -->
    <link rel="modulepreload" href="js/app.js">
    <link rel="modulepreload" href="config.js">
    <link rel="modulepreload" href="js/store.js">
    <link rel="modulepreload" href="js/services.js">
    <link rel="modulepreload" href="js/api.js">
    <link rel="modulepreload" href="js/lib/normalize.js">
    <link rel="modulepreload" href="js/lib/dates.js">
    <link rel="modulepreload" href="js/lib/isbn.js">
    <link rel="modulepreload" href="js/lib/merge.js">
    <link rel="modulepreload" href="js/lib/text.js">
    <link rel="modulepreload" href="js/lib/rateLimiter.js">
    <link rel="modulepreload" href="js/lib/search.js">
    <link rel="modulepreload" href="js/cache.js">
    <link rel="modulepreload" href="js/releases.js">
    <link rel="modulepreload" href="js/actions.js">
    <link rel="modulepreload" href="js/ui.js">
    <link rel="modulepreload" href="js/lib/follow.js">
    <link rel="modulepreload" href="js/lib/goodreads.js">
    <link rel="modulepreload" href="js/lib/stats.js">
    <link rel="modulepreload" href="js/views/home.js">
    <link rel="modulepreload" href="js/components.js">
    <link rel="modulepreload" href="js/lib/calendar.js">
    <link rel="modulepreload" href="js/sheets/progress.js">
    <link rel="modulepreload" href="js/lib/progress.js">
    <link rel="modulepreload" href="js/sheets/rate.js">
    <link rel="modulepreload" href="js/lib/moods.js">
    <link rel="modulepreload" href="js/views/library.js">
    <link rel="modulepreload" href="js/views/search.js">
    <link rel="modulepreload" href="js/sheets/releaseDate.js">
    <link rel="modulepreload" href="js/views/scan.js">
    <link rel="modulepreload" href="js/scanner.js">
    <link rel="modulepreload" href="js/views/upcoming.js">
    <link rel="modulepreload" href="js/views/stats.js">
    <link rel="modulepreload" href="js/views/settings.js">
    <link rel="modulepreload" href="js/sample.js">
    <link rel="modulepreload" href="js/views/onboarding.js">
    <link rel="modulepreload" href="js/views/book.js">
    <link rel="modulepreload" href="js/views/author.js">
    <link rel="modulepreload" href="js/views/series.js">
    <link rel="modulepreload" href="js/sheets/seriesRead.js">
    <link rel="modulepreload" href="js/keyboard.js">
    <link rel="modulepreload" href="js/firebase.js">
    <!-- Firebase SDK (version must match js/firebase.js) -->
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js">
</head>
<body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app">
        <nav class="tabs" aria-label="Main">
            <span class="tabs-brand">Book Tracker</span>
            <a href="#/" data-tab="home"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
            <a href="#/library" data-tab="library"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.6 4.6l3.4.9-3.9 14.9-3.4-.9z"/></svg><span>Library</span></a>
            <a href="#/search" data-tab="search"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><span>Search</span></a>
            <a href="#/upcoming" data-tab="upcoming"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Upcoming</span><b class="tab-badge" hidden></b></a>
            <a href="#/stats" data-tab="stats"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg><span>Stats</span></a>
        </nav>
        <main id="view" class="view" tabindex="-1">
            <div class="boot" role="status">Loading your library…</div>
        </main>
    </div>
    <div id="sheet-host" class="sheet-host" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="noscript">Book Tracker needs JavaScript to run.</p></noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
